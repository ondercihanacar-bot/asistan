name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Asistan-Pro.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asistan-Pro-Android-APK
          path: build-output/Asistan-Pro.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-latest
          name: "📱 Asistan Pro Android Mobil Uygulaması (APK)"
          body: |
            ### 💳 Asistan Pro - Android Uygulaması

            Bu sürüm **GitHub Actions CI/CD** tarafından otomatik olarak derlenmiştir.

            #### 🚀 Özellikler:
            * **Tam Ekran Deneyimi:** Tarayıcı çubukları olmadan gerçek mobil uygulama deneyimi.
            * **Samsung Galaxy & Modern Android Uyumu:** AMOLED siyah tema (`#0b0f19`), bildirim çubuğu ve delikli kamera / Dynamic Island ile kesintisiz uyum.
            * **Çoklu Bağlantı Modu:**
              * ⚡ **USB Kablo Modu:** Telefonunuz bilgisayara USB ile bağlıyken sıfır gecikme ile çalışır (`localhost:8000`).
              * 📶 **Ev/Ofis Wi-Fi Modu:** Aynı kablosuz ağda bilgisayar açıkken kablosuz çalışır (`10.22.250.66:8000`).
              * 🌐 **Bulut / Render Modu:** Dışarıdayken (4G/5G) bulut sunucunuza bağlanır.
            * **Fatura & Makbuz OCR:** Kamera ve galeri seçimi ile faturaları yapay zekaya okutma desteği.
            * **Sesli Hatırlatıcılar & Alarmlar:** Arka plan ses desteği.
            * **Aşağı Çekerek Yenileme (Pull-to-Refresh):** Listeleri hızlıca yenileme.

            #### 📥 Kurulum:
            Aşağıdaki **`Asistan-Pro.apk`** dosyasına telefonunuzdan tıklayarak doğrudan indirebilir ve kurabilirsiniz.
          files: build-output/Asistan-Pro.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
